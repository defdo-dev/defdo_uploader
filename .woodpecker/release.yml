# ─── defdo_uploader Woodpecker Release ─────────────────────────────────────
#
# Tag / manual(publish) / deployment path — split out of the combined
# .woodpecker.yml so this workflow gets its own workspace instead of sharing
# (and re-triggering alongside) the push/pull_request CI in ci.yml.
#
# release-validate is the compile on this path: it warms `_build` (dev), and
# hex-publish reuses it via the shared workspace instead of recompiling.
# hex-publish no longer re-runs `mix deps.get` / `mix test` — release-validate
# already proved the build and the suite in this same workflow.
#
# Global secrets (configured in Woodpecker org settings):
#   hex_api_key   — Hex.pm API write key
#   hex_org_token — Hex organization read token
#
# Optional environment:
#   HEX_PUBLISH_REPLACE — set to "true" to pass --replace to `mix hex.publish`

labels:
  platform: linux/amd64

when:
  - event: tag
  - event: manual
    evaluate: 'CI_PIPELINE_TRIGGER_MESSAGE == "publish"'
  - event: deployment

steps:
  - name: release-validate
    image: elixir:1.19.5
    environment:
      HEX_API_KEY:
        from_secret: hex_api_key
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
    commands:
      - |
        set -e
        HEX_ORG_NAME="defdo"
        export HEX_API_KEY HEX_ORG_NAME HEX_ORG_TOKEN

        # Defdo release tags are bare (no `v` prefix). Reject outright rather
        # than silently stripping it, so drift never re-enters the tag history.
        if [ -n "$CI_COMMIT_TAG" ]; then
          TAG="$CI_COMMIT_TAG"
          case "$TAG" in
            v*)
              echo "ERROR: tag '$TAG' is v-prefixed. Defdo release tags are bare: ${TAG#v}"
              exit 1
              ;;
          esac
        fi

        mix do local.hex --force, local.rebar --force

        if [ -n "$HEX_ORG_TOKEN" ]; then
          mix hex.organization auth "$HEX_ORG_NAME" --key "$HEX_ORG_TOKEN"
        fi

        mix deps.get
        mix format --check-formatted
        mix compile --warnings-as-errors
        mix test
        MIX_ENV=dev mix deps.get
        MIX_ENV=dev mix hex.build

  - name: hex-publish
    image: elixir:1.19.5
    depends_on: [release-validate]
    environment:
      HEX_API_KEY:
        from_secret: hex_api_key
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
    commands:
      - |
        set -e
        HEX_ORG_NAME="defdo"
        export HEX_API_KEY HEX_ORG_NAME HEX_ORG_TOKEN

        mix do local.hex --force, local.rebar --force

        if [ -n "$HEX_ORG_TOKEN" ]; then
          mix hex.organization auth "$HEX_ORG_NAME" --key "$HEX_ORG_TOKEN"
        fi

        if [ -z "$HEX_API_KEY" ]; then
          echo "ERROR: HEX_API_KEY is required to publish"
          exit 1
        fi

        if [ "$HEX_PUBLISH_REPLACE" = "true" ]; then
          mix hex.publish --yes --replace
        else
          mix hex.publish --yes
        fi
